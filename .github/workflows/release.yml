# Merge a version bump in package.json into main (or click "Run workflow" in Actions) -> builds the Windows installer,
# signs it and publishes a GitHub Release with latest.json, which installed apps read to update themselves.
# tauri-action creates the v<version> tag; a version that is already tagged is skipped.
name: release
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "v$v" >/dev/null; then
            echo "v$v is already released, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.check.outputs.skip != 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: steps.check.outputs.skip != 'true'
        run: npm ci
      - if: steps.check.outputs.skip != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: AION 2 Companion v__VERSION__
          releaseDraft: false
          includeUpdaterJson: true
