# Every merge into main (or "Run workflow" in Actions, which can pick minor/major) -> bumps the version in package.json,
# commits and tags it, builds the Windows installer, signs it and publishes a GitHub Release with latest.json,
# which installed apps read to update themselves. Pushes made with GITHUB_TOKEN don't re-trigger this workflow.
name: release
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        options: [patch, minor, major]
        default: patch

# Back-to-back merges release one after the other, each on top of the previous bump.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bump version, commit and tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Two merges seconds apart: this run's checkout can be behind main by the time it pushes.
          # Bump on top of the latest main, push branch and tag together (--atomic: never a tag
          # without its commit), and retry on a rejected push.
          for try in 1 2 3; do
            git fetch origin main --tags --force
            git reset --hard origin/main
            v=$(npm version "${{ inputs.bump || 'patch' }}" --no-git-tag-version)
            git commit -am "${v#v}"
            git tag -f "$v"
            if git push --atomic origin HEAD:main "$v"; then exit 0; fi
            git tag -d "$v"
            sleep $((try * 5))
          done
          exit 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: AION 2 Companion v__VERSION__
          releaseDraft: false
          includeUpdaterJson: true
