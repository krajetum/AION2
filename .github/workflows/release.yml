# The only workflow. A pull request runs the check job only; nothing runs on a branch without one.
# Every merge into main (or "Run workflow" in Actions, which can pick minor/major) -> checks, then:
# - server: if server/ changed, applies the D1 migrations and deploys the Cloudflare Worker (no app version bump);
# - release: if anything else changed, bumps the version in package.json, commits and tags it, builds the Windows
#   installer, signs it and publishes a GitHub Release with latest.json, which installed apps read to update themselves.
# Every merge into beta -> checks, then release builds a pre-release instead: version = next patch + "-<run number>"
#   (src/domain/release.ts), set only in this run's checkout (no commit on any branch; tag v<version> on the beta commit),
#   published as a GitHub pre-release, which releases/latest never points at, so stable apps don't see it. No server deploy.
# Both write latest-beta.json (release "beta-channel"), the manifest of apps with beta versions on (src-tauri/src/updates.rs).
# Pushes made with GITHUB_TOKEN don't re-trigger this workflow.
name: release
on:
  push:
    branches: [main, beta]
    paths-ignore: ["**.md"]
  # Pull requests run the check job only (server and release are skipped below).
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        options: [patch, minor, major]
        default: patch

# Back-to-back merges release one after the other, each on top of the previous bump.
# A pull request's checks get their own group, so they never wait behind a release.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.changes.outputs.app }}
      server: ${{ steps.changes.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx tsc -p server
      - run: npm run check
      - name: What changed
        id: changes
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Manual run, first push, or a "before" commit no longer in history (force push): do both.
          if [ "${{ github.event_name }}" != push ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "server=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -v '\.md$' || true) # .md alone never releases
          echo "$files"
          if echo "$files" | grep -qv '^server/'; then app=true; else app=false; fi
          if echo "$files" | grep -q '^server/'; then server=true; else server=false; fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "server=$server" >> "$GITHUB_OUTPUT"

  server:
    needs: check
    if: github.event_name != 'pull_request' && github.ref_name == 'main' && needs.check.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4.149.0"
          workingDirectory: server
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: |
            d1 migrations apply aion2 --remote
            deploy

  release:
    needs: check
    if: github.event_name != 'pull_request' && needs.check.outputs.app == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name == 'beta' && github.sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Before the bump: a failing parser test creates no commit and no tag.
      - run: cargo test -p aion2-meter
        working-directory: src-tauri
      - name: Beta version (not committed)
        if: github.ref_name == 'beta'
        shell: bash
        run: |
          git fetch origin --tags --force
          v=$(node --input-type=module -e 'import { betaVersion } from "./src/domain/release.ts"; console.log(betaVersion(process.argv[1].split(/\s+/), +process.argv[2]))' "$(git tag -l 'v*')" "${{ github.run_number }}")
          npm version "$v" --no-git-tag-version
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Bump version, commit and tag
        if: github.ref_name != 'beta'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Two merges seconds apart: this run's checkout can be behind main by the time it pushes.
          # Bump on top of the latest main, push branch and tag together (--atomic: never a tag
          # without its commit), and retry on a rejected push.
          for try in 1 2 3; do
            git fetch origin main --tags --force
            git reset --hard origin/main
            v=$(npm version "${{ inputs.bump || 'patch' }}" --no-git-tag-version)
            git commit -am "${v#v}"
            git tag -f "$v"
            if git push --atomic origin HEAD:main "$v"; then echo "VERSION=${v#v}" >> "$GITHUB_ENV"; exit 0; fi
            git tag -d "$v"
            sleep $((try * 5))
          done
          exit 1
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Uploads the JS source maps to Sentry during the Vite build (vite.config.ts); without it, no upload.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: AION 2 Companion v__VERSION__${{ github.ref_name == 'beta' && ' (beta)' || '' }}
          releaseDraft: false
          prerelease: ${{ github.ref_name == 'beta' }}
          includeUpdaterJson: true
      # latest-beta.json on the release "beta-channel" (made once; a pre-release, so never "latest"). Every build rewrites
      # it, stable ones too: runs share one concurrency group, and a stable build is always above the betas made before it
      # (they are its version's pre-releases), so it names the newest of both channels and beta apps get stable releases.
      - name: Beta manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view beta-channel >/dev/null 2>&1 || gh release create beta-channel --prerelease --target "$GITHUB_SHA" \
            --title "Beta channel" --notes "Holds latest-beta.json, the update manifest of apps with beta versions turned on. The builds are the other releases."
          gh release download "v$VERSION" -p latest.json -O latest-beta.json
          gh release upload beta-channel latest-beta.json --clobber
      # The Rust debug symbols (.pdb), so Sentry can name the functions in a panic's stack trace.
      - name: Upload Rust debug files to Sentry
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: krajetum
          SENTRY_PROJECT: javascript-svelte
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then echo "No SENTRY_AUTH_TOKEN secret: skipped"; exit 0; fi
          # The app's own exe + pdb only (not target/release/deps: thousands of files). `sentry` = @sentry/vite-plugin's CLI.
          npx sentry debug-files upload --include-sources src-tauri/target/release/*.exe src-tauri/target/release/*.pdb
