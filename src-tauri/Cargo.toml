[workspace]
members = ["meter"]

[package]
name = "aion2-companion"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "aion2_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
# DPS meter core: passive capture + parser, vendored from A2Tools DPS Meter (GPL-3.0), see meter/NOTICE.md
aion2-meter = { path = "meter" }
